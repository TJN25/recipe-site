<!-- File: web/template/recipe_page.html -->
{{define "title"}}{{ .Recipe.Title }} - The Serving Station{{end}}

{{define "content"}}
<article class="recipe relative" >

    {{ template "tabs" . }}
    {{ template "view_options_panel" . }}

    <div x-show="activeTab === 'full'">
        {{ template "full_look_content" . }}
    </div>

    <div x-show="activeTab === 'zen'">
        {{ template "zen_mode_content_wrapper" . }}
    </div> 

</article>

{{end}}
