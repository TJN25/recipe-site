{{ define "methods_section" }}
<div class="recipe-method-section" open> {{/* Starts open */}}
    <h1 class="font-serif text-xl font-bold cursor-pointer mb-4 text-accent-900 dark:text-accent-100">
        Method
    </h1>
    <div  class="mb-3">
        <div id="methods-list-container"
            hx-trigger="recipeUpdated from:window"
             hx-get="/render-full-methods/{{ .Recipe.ID }}"
             hx-target="this"
             hx-swap="innerHTML">
            {{ template "methods-list" . }}
        </div>
    </div>
</div>
{{ end }}
