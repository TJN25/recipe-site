<!-- file: web/template/layouts/base.html -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{block "title" .}}the serving station{{end}}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lzyygjmzgswoxrggbchcjc0rb2xoqrxetuqyrjronlcoyta87ikbwq3esdm2" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'selector', // Enable dark mode via .dark class
        theme: {
          extend: {} // Keep empty for now
        }
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!--<link rel="stylesheet" href="/static/css/output.css">-->

</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-200">
    <header class="py-4 border-b border-slate-200 dark:border-slate-700">
        <h1 class="text-3xl font-bold text-center">
            <a href="/" class="text-slate-900 dark:text-slate-100 no-underline hover:text-sky-600 dark:hover:text-sky-400">The Serving Station</a>
        </h1>
    </header>
    <main class="py-8 px-4 max-w-4xl mx-auto">
        {{block "content" .}}
            <p>Default page content goes here if not overridden.</p>
        {{end}}
    </main>
    <footer class="mt-12 py-4 border-t border-slate-200 dark:border-slate-700 text-center text-sm text-slate-500 dark:text-slate-400">
        <p>&copy; {{ .CurrentYear }} My Recipe Site</p>
    </footer>
</body>
</html>
