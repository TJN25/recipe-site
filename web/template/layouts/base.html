<!-- file: web/template/layouts/base.html -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{block "title" .}}the serving station{{end}}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/output.css">

</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-200 font-sans">
    <header class="py-4 border-b border-slate-200 dark:border-slate-700">
        <h1 class="font-serif text-3xl font-bold text-center text-slate-900 dark:text-slate-100">
            <a href="/" class="no-underline text-current hover:text-accent-600 dark:hover:text-accent-400">The Serving Station</a>
        </h1>
        <h2 class="font-sans text-base font-normal text-center text-slate-600 dark:text-slate-400">Your recipes, your way!</h2>
    </header>
    <main class="py-8 px-4 max-w-4xl mx-auto">
        {{block "content" .}}
            <p>Default page content goes here if not overridden.</p>
        {{end}}
    </main>
    <footer class="mt-12 py-4 border-t border-slate-200 dark:border-slate-700 text-center text-sm text-slate-500 dark:text-slate-400">
        <p class="font-light text-sm text-slate-500 dark:text-slate-400">&copy; {{ .CurrentYear }} The Serving Station</p>
    </footer>
</body>
</html>
